name: Build APK
on:
  push:
    paths:
      - 'project*.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack project
        run: |
          mkdir src
          unzip -q project*.zip -d src
      - name: Build APK
        working-directory: src
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Publish APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp src/app/build/outputs/apk/debug/app-debug.apk Mcmusic.apk
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest Mcmusic.apk --repo "$GITHUB_REPOSITORY" --title "Mcmusic" --notes "Сборка №${{ github.run_number }}"
