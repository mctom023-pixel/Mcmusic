name: Build APK
on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack project
        run: |
          f=$(git log -1 --diff-filter=AM --name-only --pretty=format: -- '*.zip' | grep -m1 '\.zip$' || true)
          if [ -z "$f" ]; then f=$(ls -t *.zip | head -1); fi
          echo "Using: $f"
          mkdir src
          unzip -q "$f" -d src
      - name: Build APK
        working-directory: src
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Publish APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp src/app/build/outputs/apk/debug/app-debug.apk Mcmusic.apk
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest Mcmusic.apk --repo "$GITHUB_REPOSITORY" --title "Mcmusic" --notes "Сборка №${{ github.run_number }}"
